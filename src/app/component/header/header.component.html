<header class="header">
    <div class="container">
        <div class="header-flex-catalog">
            <div class="header__left">
                <div class="header-logo">
                    <img src="/assets/Frame.svg" alt="логотип">
                </div>
                <nav class="header-nav">
                    <ul class="header-ul">
                        <li class="header-items"><a routerLink="/">{{headerItem1}}</a></li>
                        <li class="header-items"><a href="#" onclick="event.preventDefault()" onclick="event.preventDefault()">{{aboutCompany}}</a></li>
                        <li class="header-items"><a href="#" onclick="event.preventDefault()">{{headerItem3}}</a></li>
                    </ul>
                </nav>
            </div>
            <button (click)="this.AuthServiceService.loginAsUser()" routerLink="/" class="header-button">войти как юзер</button>
            <button (click)="this.AuthServiceService.loginAsAdmin()" routerLink="/admin" class="header-button">войти как администратор</button>
            <button *ngIf="this.AuthServiceService.isAdmin()" (click)="this.AuthServiceService.logout()" routerLink="/" class="header-button">Выйти</button>
            <div class="header__right">
                <button routerLink = '/users' class="header-user">
                    <p>Пользователи</p>
                </button>
                <div class="header-contact"><a href="tel:+7 (965) 084-29-29"><img src="assets/Phone.svg">+7 (965)
                        084-29-29</a></div>
                <div class="header-heart">
                    <a href="#" onclick="event.preventDefault()"><img src="assets/heart1.svg"></a>
                </div>
                <button class="header-button" appEditColor>
                    <img src="/assets/cart.svg" alt="корзина">
                    <p>Пусто</p>
                </button>
            </div>
        </div>
    </div>
</header>
<section class="catalog">
    <div class="container">
        <div class="header-flex-catalog">
            <div class="catalog__left">
                <ul class="catalog-ul">
                    <li *ngFor='let catalogItem of catalogItems'><a href="#" onclick="event.preventDefault()"><img src="/assets/light.svg" alt="|||">{{catalogItem}}</a></li>
                </ul>
            </div>
            <div class="catalog__right">
                <div class="catalog-search">
                    <form>
                        <input type="text" name="text" class="search" placeholder="Поиск, например Круг зачистной ">
                        <button>
                            <img src="/assets/Maskgroup.svg" alt="поиск">
                        </button>
                    </form>
                </div>
                <div class="catalog-local">
                    <a href="#" onclick="event.preventDefault()">
                        <img src="/assets/Vector.svg" alt="локация">
                        <p>Москва</p>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
